# Moi gia tri nhay cam doc tu bien moi truong. KHONG ghi mat khau / khoa vao file nay.
spring:
  application:
    name: scanit-api
  profiles:
    default: dev   # chay local khong can cau hinh; production dat SPRING_PROFILES_ACTIVE=prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scanit}
    username: ${DB_USER:scanit}
    password: ${DB_PASSWORD:scanit}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

scanit:
  jwt:
    # Bat buoc, toi thieu 32 ky tu. Tao: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  media:
    # Chi can ten cloud de dung URL anh (khong can API secret de doc)
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  # Chi bat o dev: tao tai khoan va hang mau
  seed-dev-data: ${SEED_DEV_DATA:false}
